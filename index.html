<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JourVanVista｜くつろぎ方を、変えられる。</title>
<style>
:root{--bg:#fff;--fg:#111;--sub:#555;--gray:#f2f2f2;--line:#ddd;--btn:#111;--btnfg:#fff;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f5f5f5;--sub:#bbb;--gray:#1c1c1c;--line:#333;--btn:#fff;--btnfg:#111}}
:root[data-theme="dark"]{--bg:#111;--fg:#f5f5f5;--sub:#bbb;--gray:#1c1c1c;--line:#333;--btn:#fff;--btnfg:#111}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:17px;line-height:1.8;-webkit-text-size-adjust:100%}
.w{max-width:720px;margin:0 auto;padding:0 20px}
img{display:block;width:100%;height:auto}
section{padding:56px 0;border-top:1px solid var(--line)}
h1{font-size:34px;line-height:1.35;margin:24px 0 8px}
h2{font-size:26px;line-height:1.4;margin:0 0 20px}
p{margin:0 0 16px}.sub{color:var(--sub)}
.btn{display:block;text-align:center;background:var(--btn);color:var(--btnfg);text-decoration:none;font-weight:700;font-size:18px;padding:18px 16px;border-radius:999px;margin:20px 0 10px}
.note{font-size:16px;color:var(--sub);text-align:center}
figure{margin:0 0 32px}figcaption{margin-top:10px}figcaption b{display:block;font-size:20px}
.gray{background:var(--gray)}
.sp{display:grid;gap:16px;margin-top:8px}
.sp div{border:1px solid var(--line);padding:20px;background:var(--bg)}
.sp small{display:block;font-size:16px;color:var(--sub)}.sp strong{font-size:28px}
.price{font-size:40px;font-weight:700;margin:0}
footer{padding:40px 0;border-top:1px solid var(--line);font-size:16px;color:var(--sub)}
footer a{color:var(--fg)}
</style></head><body>
